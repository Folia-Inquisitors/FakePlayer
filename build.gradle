plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.2'
}

group = 'me.chrommob'
version = '1.0-SNAPSHOT'

def resolveBoolFlag = { String key, String envKey, boolean defaultValue ->
    def raw = System.getProperty(key)
    if (raw == null && project.hasProperty(key)) {
        raw = project.property(key).toString()
    }
    if (raw == null && envKey != null) {
        raw = System.getenv(envKey)
    }
    return raw == null ? defaultValue : raw.toString().toBoolean()
}

def shadePacketEvents = resolveBoolFlag('shadePE', 'SHADE_PE', true)

repositories {
    mavenCentral()
    maven {
        name = "folia-inquistors-repo"
        url = "https://folia-inquisitors.github.io/FoliaDevBundle/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        url = uri("https://repo.opencollab.dev/main/")
    }
    maven {
        url 'https://repo.codemc.io/repository/maven-releases/'
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }
    maven {
        url = 'https://nexus.scarsz.me/content/repositories/public/'
    }
}

dependencies {
    compileOnly "dev.folia:folia-api:26.1.2.build.8-stable"
    compileOnly 'me.clip:placeholderapi:2.12.2'
    if (shadePacketEvents) {
        implementation 'com.github.retrooper:packetevents-spigot:2.12.2'
    } else {
        compileOnly 'com.github.retrooper:packetevents-spigot:2.12.2'
    }
    implementation('me.hsgamer:hscore-config-proxy:4.9.0')
    implementation('me.hsgamer:hscore-bukkit-config:4.9.0')
    compileOnly 'com.zaxxer:HikariCP:7.0.2'
    compileOnly 'com.discordsrv:discordsrv:1.30.5'
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [
            version           : version,
            packetEventsDepend: shadePacketEvents ? '' : 'depend: [packetevents]'
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    if (shadePacketEvents) {
        relocate("com.github.retrooper.packetevents", "me.chrommob.libs.packetevents.com.github.retrooper.packetevents")
        relocate("io.github.retrooper.packetevents", "me.chrommob.libs.packetevents.io.github.retrooper.packetevents")
    }
    relocate("me.hsgamer.hscore", "me.chrommob.libs.hscore")

    mergeServiceFiles()

    manifest {
        attributes(
            'paperweight-mappings-namespace': 'mojang'
        )
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

jar {
    enabled = false
}
