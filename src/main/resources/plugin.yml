name: FakePlayer
version: '${version}'
main: me.chrommob.fakeplayer.FakePlayer
api-version: '26.1.2'
folia-supported: true
${packetEventsDepend}
softdepend: [PlaceholderAPI, DiscordSRV]
libraries:
  - com.zaxxer:HikariCP:7.0.2
commands:
  reloadfakeplayer:
    description: Reloads the FakePlayer plugin
    usage: /reloadfakeplayer
    permission: fakeplayer.reload
    aliases: [rfp]
permissions:
  fakeplayer.reload:
    description: Allows the player to reload the FakePlayer plugin
    default: op
  fakeplayer.exempt:
    description: Allows the player to bypass the FakePlayer plugin
    default: op
  fakeplayer.interaction.bypass:
    description: Allows the player to bypass fake-player interaction protections
    default: op
